server:
  port: 10010

spring:
  application:
    name: easy-ai-starter-test
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://gz-cdb-2pdyepq9.sql.tencentcdb.com:28051/tblog?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
    username: root
    password: '@Link123'
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    clear-checksums: true
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    map-underscore-to-camel-case: true
  global-config:
    banner: false

# easy-ai framework
easy-ai:
  enabled: true
  task-engine:
    enabled: true
    annotation:
      enabled: true
    llm:
      provider: deepseek
      model: deepseek-chat
      max-retries: 2
      initial-backoff-ms: 1000
      log-enabled: true
    snowflake:
      worker-id: 1
      datacenter-id: 0
    resilience:
      enabled: true
      rate-limit-per-second: 20
    history:
      max-messages: 20
    lifecycle:
      timeout-minutes: 30
      max-turns: 20

# LLM configuration (new format)
llm:
  provider: deepseek
  providers:
    deepseek:
      api-key: sk-6792b5af077540229d6677ace1320f11
      endpoint: https://api.deepseek.com
      model: deepseek-chat
    doubao:
      api-key: a677a788-0b1f-4258-a0af-f4742b070f18
      endpoint: https://ark.cn-beijing.volces.com/api/v3
      model: doubao-seed-1-6-251015
    kimi:
      api-key: sk-ocleVYXK558Sx6kqIvFJ0u1YX0vk9sIGdChophUlNjfqusHn
      endpoint: https://api.moonshot.cn/v1
      model: kimi-k2-turbo-preview

logging:
  level:
    com.link.easyai: debug

# Actuator 监控端点（暴露框架运行指标）
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
