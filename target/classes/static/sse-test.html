<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Easy-AI SSE 流式响应测试</title>
<style>
  :root {
    --bg: #f3f4f8;
    --panel: #ffffff;
    --panel-2: #f7f8fb;
    --border: #e4e7ef;
    --text: #1f2329;
    --muted: #697089;
    --accent: #3b82f6;
    --accent-2: #0284c7;
    --green: #10b981;
    --yellow: #d97706;
    --red: #dc2626;
    --purple: #7c3aed;
    --mono: "Cascadia Code", "JetBrains Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    min-height: 100vh; padding: 20px;
  }
  .wrap { max-width: 1280px; margin: 0 auto; }

  /* 顶部 */
  header { display: flex; align-items: baseline; gap: 14px; margin-bottom: 18px; flex-wrap: wrap; }
  header h1 { font-size: 20px; font-weight: 700; letter-spacing: .5px; }
  header h1 .dot { color: var(--accent-2); }
  .endpoint { font-family: var(--mono); font-size: 12px; color: var(--muted);
    background: var(--panel); border: 1px solid var(--border); padding: 4px 10px; border-radius: 6px; }

  /* 卡片 */
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  .card h2 { font-size: 13px; color: var(--muted); font-weight: 600; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }

  /* 输入区 */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
  .field input, .field textarea {
    width: 100%; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px;
    font-size: 14px; outline: none; transition: border-color .15s;
    font-family: var(--mono);
  }
  .field input:focus, .field textarea:focus { border-color: var(--accent); }
  .field.full { grid-column: 1 / -1; }
  .field textarea { min-height: 76px; resize: vertical; font-family: inherit; line-height: 1.5; }

  .presets { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .presets button {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    padding: 5px 12px; border-radius: 999px; font-size: 12px; cursor: pointer; transition: all .15s;
  }
  .presets button:hover { border-color: var(--accent); color: var(--accent-2); }

  .actions { display: flex; gap: 10px; margin-top: 14px; }
  .btn {
    border: none; border-radius: 8px; padding: 10px 22px; font-size: 14px; font-weight: 600;
    cursor: pointer; transition: all .15s;
  }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn-send { background: var(--accent); color: #fff; }
  .btn-send:not(:disabled):hover { background: #3d78e8; }
  .btn-stop { background: transparent; color: var(--red); border: 1px solid var(--red); }
  .btn-stop:not(:disabled):hover { background: rgba(248,113,113,.12); }
  .btn-clear { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  .btn-clear:not(:disabled):hover { color: var(--text); border-color: var(--muted); }

  /* 状态栏 */
  .statusbar { display: flex; gap: 18px; align-items: center; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
  .statusbar .state { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; }
  .state .led { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .state.idle .led { background: var(--muted); }
  .state.running .led { background: var(--yellow); animation: pulse 1s infinite; }
  .state.done .led { background: var(--green); }
  .state.error .led { background: var(--red); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
  .statusbar .badge { font-family: var(--mono); font-size: 12px; background: var(--panel-2);
    border: 1px solid var(--border); padding: 3px 9px; border-radius: 6px; }
  .statusbar .evt-start { color: var(--accent-2); } .statusbar .evt-thinking { color: var(--yellow); }
  .statusbar .evt-token { color: var(--green); } .statusbar .evt-complete { color: var(--purple); }
  .statusbar .evt-error { color: var(--red); }

  /* 主区双栏 */
  .cols { display: grid; grid-template-columns: 1.2fr 1fr; gap: 14px; }
  @media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }

  .content-box {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    min-height: 380px; padding: 16px; white-space: pre-wrap; word-break: break-word;
    line-height: 1.7; font-size: 14px; overflow-y: auto; max-height: 620px;
  }
  .content-box .placeholder { color: var(--muted); font-size: 13px; }
  .content-box .cursor { display: inline-block; width: 8px; height: 16px; background: var(--accent-2);
    vertical-align: text-bottom; animation: blink .8s infinite; }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

  .log-box {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    font-family: var(--mono); font-size: 12px; line-height: 1.55;
    height: 620px; overflow-y: auto; padding: 10px 12px;
  }
  .log-box .empty { color: var(--muted); }
  .log-line { display: flex; gap: 8px; padding: 2px 0; border-bottom: 1px dashed #edf0f6; }
  .log-line .t { color: #9aa3b5; flex-shrink: 0; }
  .log-line .ev { font-weight: 700; flex-shrink: 0; min-width: 70px; }
  .log-line .d { color: var(--text); word-break: break-all; }
  .ev-start { color: var(--accent-2); } .ev-thinking { color: var(--yellow); }
  .ev-token { color: var(--green); } .ev-complete { color: var(--purple); } .ev-error { color: var(--red); }

  /* 完成详情 */
  .result-json {
    margin-top: 14px; background: #f6f8fb; border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 14px; font-family: var(--mono); font-size: 12px; white-space: pre-wrap;
    word-break: break-all; color: #065f46; max-height: 260px; overflow-y: auto; display: none;
  }
  .result-json.show { display: block; }

  .tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; margin-left: 6px; }
  .tag-more { background: rgba(251,191,36,.15); color: var(--yellow); }
  .tag-done { background: rgba(52,211,153,.15); color: var(--green); }
  .tag-fail { background: rgba(248,113,113,.15); color: var(--red); }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Easy-AI <span class="dot">SSE</span> 流式响应测试</h1>
    <span class="endpoint">POST /easyai/engine/chat/stream</span>
  </header>

  <!-- 输入区 -->
  <div class="card">
    <h2>请求参数</h2>
    <div class="grid">
      <div class="field full">
        <label>服务地址（双击打开 HTML 时必填；通过 http://localhost:10010/sse-test.html 访问时可留空）</label>
        <input id="serviceAddr" value="http://localhost:10010" spellcheck="false">
      </div>
      <div class="field">
        <label>sessionId（会话标识）</label>
        <input id="sessionId" value="sse-test-001" spellcheck="false">
      </div>
      <div class="field">
        <label>tenantId（租户标识）</label>
        <input id="tenantId" value="0" spellcheck="false">
      </div>
      <div class="field full">
        <label>message（用户消息）</label>
        <textarea id="message" placeholder="输入要发送给 AI 的消息，例如：帮我创建一个投诉工单">帮我创建一个投诉工单</textarea>
      </div>
    </div>
    <div class="presets" id="presets">
      <button data-msg="帮我创建一个投诉工单">创建工单</button>
      <button data-msg="帮我预约登记，我姓李">预约登记</button>
      <button data-msg="查一下我今天的账单">查今日账单</button>
      <button data-msg="我的快递到哪了">物流查询</button>
      <button data-msg="我想要退款">退款申请</button>
      <button data-msg="介绍一下你的功能">功能简介</button>
    </div>
    <div class="actions">
      <button class="btn btn-send" id="btnSend">发送（流式）</button>
      <button class="btn btn-stop" id="btnStop" disabled>断开连接</button>
      <button class="btn btn-clear" id="btnClear">清空</button>
    </div>
  </div>

  <!-- 状态栏 -->
  <div class="card" style="padding:12px 16px;">
    <div class="statusbar">
      <span class="state idle" id="state"><span class="led"></span><span id="stateText">空闲</span></span>
      <span class="badge" id="evCount">事件：0</span>
      <span class="badge" id="charCount">字符：0</span>
      <span class="badge" id="timer">耗时：0.0s</span>
      <span class="badge evt-start">start</span>
      <span class="badge evt-thinking">thinking</span>
      <span class="badge evt-token">token</span>
      <span class="badge evt-complete">complete</span>
      <span class="badge evt-error">error</span>
    </div>
  </div>

  <!-- 双栏 -->
  <div class="cols">
    <div>
      <div class="card" style="margin-bottom:0;">
        <h2>流式内容（实时打字机效果）</h2>
        <div class="content-box" id="contentBox">
          <span class="placeholder">点击「发送」开始测试，消息内容将在这里逐段输出…</span>
        </div>
      </div>
      <div class="card" style="margin-bottom:0;">
        <h2>complete 完整响应</h2>
        <div class="result-json" id="resultJson"></div>
      </div>
    </div>
    <div>
      <div class="card" style="margin-bottom:0;">
        <h2>SSE 事件流日志</h2>
        <div class="log-box" id="logBox"><span class="empty">等待事件…</span></div>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const box = $('contentBox'), logBox = $('logBox'), stateEl = $('state');
  const evCountEl = $('evCount'), charCountEl = $('charCount'), timerEl = $('timer');

  let controller = null;          // AbortController
  let evCount = 0, charCount = 0;
  let startTime = 0, timerHandle = null;
  let lastEvent = null;

  // ---- 预设消息 ----
  document.querySelectorAll('#presets button').forEach(btn => {
    btn.addEventListener('click', () => { $('message').value = btn.dataset.msg; });
  });

  // ---- 工具 ----
  const setState = (name, text) => {
    stateEl.className = 'state ' + name;
    $('stateText').textContent = text;
  };
  const log = (event, data) => {
    if (logBox.querySelector('.empty')) logBox.innerHTML = '';
    const line = document.createElement('div');
    line.className = 'log-line';
    const t = new Date().toLocaleTimeString('zh-CN', { hour12: false }) + '.' +
              String(Date.now() % 1000).padStart(3, '0');
    const ev = document.createElement('span'); ev.className = 't'; ev.textContent = t;
    const evn = document.createElement('span'); evn.className = 'ev ' + 'ev-' + event; evn.textContent = event;
    const d = document.createElement('span'); d.className = 'd'; d.textContent = data;
    line.append(ev, evn, d);
    logBox.appendChild(line);
    logBox.scrollTop = logBox.scrollHeight;
  };
  const addContent = text => {
    const ph = box.querySelector('.placeholder');
    if (ph) { ph.remove(); box.innerHTML = ''; }
    box.textContent += text;
    box.scrollTop = box.scrollHeight;
  };
  const addCursor = () => {
    let c = box.querySelector('.cursor');
    if (!c) { c = document.createElement('span'); c.className = 'cursor'; box.appendChild(c); }
    return c;
  };
  const removeCursor = () => { box.querySelectorAll('.cursor').forEach(c => c.remove()); };
  const updateStats = () => {
    evCountEl.textContent = '事件：' + evCount;
    charCountEl.textContent = '字符：' + charCount;
  };
  const stopTimer = () => { if (timerHandle) { clearInterval(timerHandle); timerHandle = null; } };
  const startTimer = () => {
    startTime = Date.now();
    timerHandle = setInterval(() => {
      timerEl.textContent = '耗时：' + ((Date.now() - startTime) / 1000).toFixed(1) + 's';
    }, 100);
  };
  const reset = () => {
    controller && controller.abort(); controller = null;
    stopTimer(); timerEl.textContent = '耗时：0.0s';
    evCount = 0; charCount = 0; updateStats();
    removeCursor();
  };

  // ---- 核心：解析 SSE 流 ----
  async function parseSSE(response) {
    const reader = response.body.getReader();
    const decoder = new TextDecoder('utf-8');
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      // SSE 以空行分隔事件
      let idx;
      while ((idx = buffer.indexOf('\n\n')) !== -1) {
        const rawEvent = buffer.slice(0, idx);
        buffer = buffer.slice(idx + 2);
        handleSSEFrame(rawEvent);
      }
    }
    // 处理尾部残留（无空行结束）
    if (buffer.trim()) handleSSEFrame(buffer);
  }

  function handleSSEFrame(frame) {
    let event = 'message', data = '';
    frame.split('\n').forEach(line => {
      if (line.startsWith('event:')) event = line.slice(6).trim();
      else if (line.startsWith('data:')) data += line.slice(5).trim();
    });
    if (!data) return;
    handleEvent(event, data);
  }

  function handleEvent(event, data) {
    evCount++;
    lastEvent = event;
    log(event, data);
    updateStats();

    switch (event) {
      case 'start':
        setState('running', '连接中…');
        break;
      case 'thinking':
        setState('running', 'AI 处理中…');
        addCursor();
        break;
      case 'token':
        try {
          const obj = JSON.parse(data);
          const content = obj.content || '';
          if (content) {
            removeCursor();
            addContent(content);
            charCount += content.length;
            updateStats();
            addCursor();
          }
        } catch (e) {
          log('token-parse-error', String(e));
        }
        break;
      case 'complete':
        stopTimer();
        removeCursor();
        setState('done', '完成');
        try {
          const obj = JSON.parse(data);
          const jsonEl = $('resultJson');
          jsonEl.classList.add('show');
          jsonEl.textContent = JSON.stringify(obj, null, 2);
          // 状态徽标
          const badges = document.createElement('div');
          const b = obj.completed ? '<span class="tag tag-done">completed</span>'
                                  : '<span class="tag tag-more">needMore</span>';
          badges.innerHTML = b;
          jsonEl.insertAdjacentElement('afterend', badges);
        } catch (e) {
          log('complete-parse-error', String(e));
        }
        timerEl.textContent = '耗时：' + ((Date.now() - startTime) / 1000).toFixed(1) + 's';
        break;
      case 'error':
        stopTimer(); removeCursor();
        setState('error', '错误');
        try { const o = JSON.parse(data); log('error-detail', o.message || ''); } catch (e) {}
        break;
      default:
        log('unknown-event', event + ' | ' + data);
    }
  }

  // ---- 发送 ----
  async function send() {
    const sessionId = $('sessionId').value.trim() || 'sse-test-001';
    const tenantId = $('tenantId').value.trim() || '0';
    const message = $('message').value.trim();
    if (!message) { alert('请输入消息'); return; }

    // 清空上次结果
    reset();
    box.innerHTML = ''; box.innerHTML = '<span class="placeholder">等待响应…</span>';
    $('resultJson').classList.remove('show'); $('resultJson').textContent = '';
    $('resultJson').nextElementSibling && $('resultJson').nextElementSibling.remove();
    logBox.innerHTML = '<span class="empty">等待事件…</span>';
    lastEvent = null;

    $('btnSend').disabled = true;
    $('btnStop').disabled = false;
    setState('running', '连接中…');
    startTimer();

    controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 320000); // 与后端 5min 超时对齐

    try {
      // 服务地址留空时使用相对路径（同源访问）；file:// 打开时用完整地址
      const base = $('serviceAddr').value.trim().replace(/\/+$/, '');
      const url = base ? base + '/easyai/engine/chat/stream' : '/easyai/engine/chat/stream';

      const resp = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sessionId, tenantId, message }),
        signal: controller.signal
      });

      if (!resp.ok) {
        const text = await resp.text();
        throw new Error('HTTP ' + resp.status + (text ? ' — ' + text.slice(0, 200) : ''));
      }
      if (!resp.body) throw new Error('浏览器不支持流式响应（无 response.body）');

      await parseSSE(resp);
      if (lastEvent !== 'complete' && lastEvent !== 'error') {
        // 连接正常关闭但未收到 complete（可能被中断）
        setState('idle', '连接已断开');
      }
    } catch (err) {
      stopTimer(); removeCursor();
      const aborted = err.name === 'AbortError';
      setState(aborted ? 'idle' : 'error', aborted ? '已停止' : '请求失败');
      log('exception', (aborted ? '已主动中断连接' : (err.message || String(err))));
    } finally {
      clearTimeout(timeout);
      $('btnSend').disabled = false;
      $('btnStop').disabled = true;
      stopTimer();
    }
  }

  // ---- 断开 ----
  $('btnStop').addEventListener('click', () => {
    if (controller) { controller.abort(); controller = null; }
    setState('idle', '已手动断开');
    stopTimer(); removeCursor();
    $('btnSend').disabled = false;
    $('btnStop').disabled = true;
    log('manual-stop', '用户手动断开 SSE 连接');
  });

  $('btnSend').addEventListener('click', send);
  $('btnClear').addEventListener('click', () => {
    box.innerHTML = '<span class="placeholder">点击「发送」开始测试…</span>';
    logBox.innerHTML = '<span class="empty">等待事件…</span>';
    $('resultJson').classList.remove('show'); $('resultJson').textContent = '';
    reset(); setState('idle', '空闲');
  });

  // 回车发送
  $('message').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
})();
</script>
</body>
</html>
